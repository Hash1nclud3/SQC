name: Hybrid Code Quality Pipeline

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      purge_history:
        description: '🧹 PURGE HISTORY: Delete previous SonarCloud state and GitHub Security alerts before scanning'
        required: true
        type: boolean
        default: false
      ai_provider:
        description: 'Select the AI Provider to execute architectural validation'
        required: true
        default: 'gemini'
        type: choice
        options:
          - gemini
          - openai
          - bedrock
      bedrock_model:
        description: 'AWS Bedrock Model ID (only used if provider is bedrock)'
        required: false
        default: 'anthropic.claude-3-5-sonnet-20240620-v1:0'
        type: string
      scan_mode:
        description: 'Scan Mode: Diff (PR changes only) or Full (Entire Repository)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - diff
      run_sonar:
        description: 'Execute SonarCloud baseline scan?'
        required: true
        type: boolean
        default: false
      run_codeql:
        description: 'Execute CodeQL code quality scan?'
        required: true
        type: boolean
        default: false

jobs:
  hybrid-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install LLM Core Libraries
        run: npm install @google/genai openai @aws-sdk/client-bedrock-runtime

      # ------------------------------------------------------------
      # OPTIONAL CLEAN SLATE (PURGE SONARCLOUD & GITHUB SECURITY TAB)
      # ------------------------------------------------------------
      - name: Master Purge (SonarCloud & Code Scanning History)
        if: ${{ github.event.inputs.purge_history == 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Initiating Clean Slate Protocol..."
          
          # 1. Purge SonarCloud
          if [ -f "sonar-project.properties" ]; then
            PROJECT_KEY=$(awk -F'=' '/^sonar\.projectKey/ {print $2}' sonar-project.properties | tr -d ' \r\n')
            echo "🗑️ Purging SonarCloud project: $PROJECT_KEY"
            curl -s -u "$SONAR_TOKEN:" -X POST "https://sonarcloud.io/api/projects/delete?project=$PROJECT_KEY"
          else
            echo "⚠️ sonar-project.properties not found! Skipping SonarCloud purge."
          fi

          # 2. Purge GitHub Code Scanning (CodeQL & AI SARIFs)
          echo "🗑️ Purging GitHub Code Scanning alerts (CodeQL & AI)..."
          
          # Fetch all analyses and filter for the ones marked as "deletable: true"
          ANALYSIS_IDS=$(gh api -X GET "repos/${{ github.repository }}/code-scanning/analyses?per_page=100" --jq '.[] | select(.deletable==true) | .id' || echo "")
          
          if [ -z "$ANALYSIS_IDS" ]; then
            echo "✅ No GitHub code scanning analyses found to delete."
          else
            for id in $ANALYSIS_IDS; do
              echo "Deleting analysis chain starting at ID: $id"
              # confirm_delete=true wipes the entire history for the tool configuration
              gh api -X DELETE "repos/${{ github.repository }}/code-scanning/analyses/$id?confirm_delete=true" --silent || echo "⚠️ Failed to delete $id, moving to next."
            done
            echo "✅ GitHub Security Tab successfully wiped."
          fi
          
          echo "✅ Master purge complete! Waiting 5 seconds for backend systems to sync..."
          sleep 5

      # ------------------------------------------------------------
      # CODEQL - NATIVE GITHUB SAST (Quality Only)
      # ------------------------------------------------------------
      - name: Initialize CodeQL
        if: ${{ github.event_name == 'pull_request' || inputs.run_codeql == 'true' }}
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          config-file: ./.github/codeql-config.yml

      - name: Perform CodeQL Analysis
        if: ${{ github.event_name == 'pull_request' || inputs.run_codeql == 'true' }}
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

      # ------------------------------------------------------------
      # SONARCLOUD SCAN (Asynchronous)
      # ------------------------------------------------------------
      - name: SonarCloud Scan
        if: ${{ github.event_name == 'pull_request' || inputs.run_sonar == 'true' }}
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ------------------------------------------------------------
      # INTELLIGENT EXPERT REVIEW (Multi-LLM Layer)
      # ------------------------------------------------------------
      - name: Extract Target Git Diff (If Diff Mode)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff origin/${{ github.base_ref }}...origin/${{ github.head_ref }} > pr_changes.diff
          else
            git diff origin/main...HEAD > pr_changes.diff
          fi

      - name: Extract Sonar Project Key from Properties
        run: |
          if [ -f "sonar-project.properties" ]; then
            PROJECT_KEY=$(awk -F'=' '/^sonar\.projectKey/ {print $2}' sonar-project.properties | tr -d ' \r\n')
            echo "DYNAMIC_SONAR_KEY=$PROJECT_KEY" >> $GITHUB_ENV
            echo "Successfully extracted Sonar Project Key: $PROJECT_KEY"
          else
            echo "⚠️ sonar-project.properties not found!"
          fi

      - name: Execute Multi-LLM AI Evaluation & Fetch Sonar API
        if: success()
        env:
          AI_PROVIDER: ${{ github.event.inputs.ai_provider || 'gemini' }}
          SCAN_MODE: ${{ github.event.inputs.scan_mode || 'full' }} 
          BEDROCK_MODEL_ID: ${{ github.event.inputs.bedrock_model || 'anthropic.claude-3-5-sonnet-20240620-v1:0' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ env.DYNAMIC_SONAR_KEY }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node .github/scripts/hybrid-orchestrator.js

      - name: Upload Combined AI & Sonar Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ai-results.sarif
          category: Hybrid-Review-Engine

      # ------------------------------------------------------------
      # PUBLISH AI TRIAGE SUMMARY & METRICS
      # ------------------------------------------------------------
      - name: Publish AI Triage Report to Job Summary
        if: always()
        run: |
          if [ -f "ai-triage-report.md" ]; then
            cat ai-triage-report.md >> $GITHUB_STEP_SUMMARY
          fi
